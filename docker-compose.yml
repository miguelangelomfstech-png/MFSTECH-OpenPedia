# Local development infrastructure + optional full stack.
#   pnpm infra:up                     -> only backing services (run web/worker on host)
#   docker compose --profile app up   -> everything, including web + worker (FFmpeg inside)
name: openpedia

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me-please-32chars
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    profiles: [app]
    build: { context: ., target: tools }
    env_file: .env.docker
    command: ["pnpm", "--filter", "@wiki/db", "migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., target: web }
    env_file: .env.docker
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., target: worker }   # image includes ffmpeg
    env_file: .env.docker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
