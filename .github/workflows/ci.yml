name: CI & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

  docker-build:
    name: Build & Push Container Images
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/openpedia-web
            ghcr.io/${{ github.repository_owner }}/openpedia-worker
            ghcr.io/${{ github.repository_owner }}/openpedia-tools
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push Tools / Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tools
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openpedia-tools:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openpedia-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openpedia-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openpedia-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openpedia-worker:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openpedia-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
